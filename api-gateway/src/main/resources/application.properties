spring.application.name=api-gateway
server.port=8080

# Service Discovery (Eureka) configuration
spring.cloud.discovery.enabled=true
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true

# Gateway configuration
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# JWT Configuration
jwt.secret=ujh0um82EHE7BVHGSL62MG0uKZqGbpXQWrdkvJCxN78=
jwt.expiration=86400000

# OpenTelemetry Configuration
otel.service.name=apigateway
otel.service.version=1.0.0
otel.exporter.otlp.endpoint=http://otel-collector:4317
otel.exporter.otlp.protocol=grpc
otel.resource.attributes[service.name]=apigateway
otel.resource.attributes[service.version]=1.0.0
otel.resource.attributes[deployment.environment]=docker
otel.traces.sampler=parentbased_always_on
otel.metrics.exporter=otlp
otel.logs.exporter=otlp

# Management endpoints for observability
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true