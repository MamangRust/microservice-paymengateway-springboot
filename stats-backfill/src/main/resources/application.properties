spring.application.name=stats-backfill
server.port=0

# Transaction DB
backfill.transaction.datasource.url=jdbc:postgresql://transaction-db:5432/transaction_service
backfill.transaction.datasource.username=postgres
backfill.transaction.datasource.password=password
backfill.transaction.datasource.driver-class-name=org.postgresql.Driver

# Kafka
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Backfill window
backfill.from=2020-01-01

# Disable web server — one-shot job
spring.main.web-application-type=none
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration