spring.application.name=stats-writer
server.port=8095

# Eureka Client Configuration
spring.cloud.discovery.enabled=true
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true

# Kafka Configuration
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=stats-writer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=true

# ClickHouse Configuration
clickhouse.enabled=true
clickhouse.url=jdbc:clickhouse://clickhouse:8123/pos_stats
clickhouse.username=default
clickhouse.password=

# OpenTelemetry Configuration
otel.service.name=stats-writer
otel.service.version=1.0.0
otel.exporter.otlp.endpoint=http://otel-collector:4317
otel.exporter.otlp.protocol=grpc
otel.resource.attributes[service.name]=stats-writer
otel.resource.attributes[service.version]=1.0.0
otel.resource.attributes[deployment.environment]=docker
otel.traces.sampler=parentbased_always_on
otel.metrics.exporter=otlp
otel.logs.exporter=otlp

# Management endpoints for observability
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true