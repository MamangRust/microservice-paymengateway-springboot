spring.application.name=auth-service
server.port=8085

# Eureka Client Configuration
spring.cloud.discovery.enabled=true
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.cloud.openfeign.client.config.user.url=http://user-service:8084

# User Service Configuration
user.service.url=http://user-service:8084

# JWT Configuration
jwt.secret=ujh0um82EHE7BVHGSL62MG0uKZqGbpXQWrdkvJCxN78=
jwt.expiration=86400000

# OpenTelemetry Configuration
otel.service.name=auth-service
otel.service.version=1.0.0
otel.exporter.otlp.endpoint=http://otel-collector:4317
otel.exporter.otlp.protocol=grpc
otel.resource.attributes[service.name]=auth-service
otel.resource.attributes[service.version]=1.0.0
otel.resource.attributes[deployment.environment]=docker
otel.traces.sampler=parentbased_always_on
otel.metrics.exporter=otlp
otel.logs.exporter=otlp

# Management endpoints for observability
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true